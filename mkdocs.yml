site_name: 工业与机器视觉100问
site_url: https://lanqingsong.github.io/industrial-machine-vision-100-questions/
repo_url: https://github.com/Lanqingsong/industrial-machine-vision-100-questions
repo_name: Lanqingsong/industrial-machine-vision-100-questions
site_author: 兰青松
site_description: 工业视觉图文与代码资料，当前发布第1—60问
copyright: Copyright © 2026 兰青松（LanQS）
use_directory_urls: false

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue grey
    accent: amber

nav:
  - 开始阅读:
      - 图书首页: index.md
      - 关于这本书: preface.md
  - 正文:
      - 第一章（Q1–Q30）: chapters/chapter-01-q01-q30.md
      - 第二章（Q31–Q40）: chapters/chapter-02-q31-q40.md
      - 第三章（Q41–Q55）: chapters/chapter-03-q41-q55.md
      - 第四章（Q56–Q60）: chapters/chapter-04-q56-q60.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
